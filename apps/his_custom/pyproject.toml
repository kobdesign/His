[project]
name = "his_custom"
authors = [
    { name = "iPassion Co., Ltd.", email = "abhisak@ipassion.co.th" },
]
description = "Hospital Information System customizations on top of Frappe Health / ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # frappe / erpnext / healthcare ถูกจัดการโดย bench — อย่าใส่ที่นี่
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = [
    "B017",
    "B023",
    "B904",
    "E101",
    "E402",
    "E501",
    "W191",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
